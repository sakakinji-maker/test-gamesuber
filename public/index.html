<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>일단 만들어보는 바이브코딩 게임만들기</title>
<link rel="stylesheet" href="home.css">
</head>
<body>

<header class="hero">
  <h1>일단 만들어보는 바이브코딩 게임만들기</h1>
  <input type="text" id="game-search" placeholder="게임 이름으로 검색해보세요 (예: 원카드)">
</header>

<section class="info-bar">
  <div class="info-card" id="calendar-card"></div>
  <div class="info-card" id="weather-card">
    <div class="weather-icon" id="weather-icon">⏳</div>
    <div class="weather-text" id="weather-text">날씨 불러오는 중...</div>
  </div>
</section>

<section class="game-list" id="game-list"></section>

<script src="home.js"></script>
</body>
</html>
